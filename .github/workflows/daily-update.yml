name: Daily Pi Source Check

'on':
  schedule:
    - cron: '1 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pi-source:
    name: Verify the Pi digit source
    runs-on: ubuntu-latest
    steps:
      - name: Check the first digits of Pi
        run: |
          response=$(curl --fail --silent --show-error --max-time 15 \
            'https://api.pi.delivery/v1/pi?start=0&numberOfDigits=16')
          content=$(printf '%s' "$response" | sed -n 's/.*"content":"\([0-9]*\)".*/\1/p')
          test "$content" = '3141592653589793'
